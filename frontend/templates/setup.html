{% extends "base.html" %}
{% block title %}Financial Setup · MoneyJar{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Let's set up your money</h1>
  <p class="muted">A quick snapshot so MoneyJar knows where you stand. You can change these anytime.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Monthly income (₹)
      <input type="number" name="monthly_income" min="0" step="1" value="{{ current_user.monthly_income|int if current_user.monthly_income else '' }}" placeholder="e.g. 40000">
    </label>
    <label>Pocket money — day-to-day spending allowance (₹)
      <input type="number" name="pocket_money" min="0" step="1" value="{{ current_user.pocket_money|int if current_user.pocket_money else '' }}" placeholder="e.g. 5000">
    </label>
    <label>How much do you need to give people — dues, repayments, loans (₹)
      <input type="number" name="money_to_give" min="0" step="1" value="{{ current_user.money_to_give|int if current_user.money_to_give else '' }}" placeholder="e.g. 2000">
    </label>
    <label>Current savings (₹)
      <input type="number" name="current_savings" min="0" step="1" value="{{ current_user.current_savings|int if current_user.current_savings else '' }}" placeholder="e.g. 15000">
    </label>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  {% if not current_user.onboarded %}
  <form method="post" style="margin-top: 12px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="skip" value="1">
    <button type="submit" class="btn btn-secondary">Skip for now</button>
  </form>
  {% endif %}
</div>
{% endblock %}
